name: Last Supper ticket monitor

on:
  push:
    branches: [main]
  schedule:
    # GitHub's minimum interval is 5 minutes. Offset from the top of the hour.
    - cron: "2/5 * 15-30 9 *"
    - cron: "2/5 * 1-6 10 *"
    # Daily health heartbeat at about 09:09 China/Singapore time (01:09 UTC).
    # Minute 09 does not overlap the high-frequency 02/07/12/... schedule.
    - cron: "9 1 16-30 9 *"
    - cron: "9 1 1-6 10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: last-supper-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BARK_URL: ${{ secrets.BARK_URL }}
      BARK_LEVEL: timeSensitive
      BARK_SOUND: alarm
      BROWSER_CHANNEL: chrome
      HEADLESS: "true"
      LOG_LEVEL: INFO
      MIN_SEATS: "2"
      LATEST_ENTRY_TIME: "16:30"
      CHECK_MAX_ATTEMPTS: "3"
      CHECK_RETRY_DELAY_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send one-time setup test push
        if: github.event_name == 'push' && github.run_number == 1
        run: |
          python - <<'PY'
          from monitor import send_bark
          send_bark(
              "最后的晚餐余票监控",
              "云端监控已经启动。之后发现 2026-10-06 余票时会立即通知你。",
              urgent=True,
          )
          PY
      - name: Check 2026-10-06 availability
        id: availability_check
        run: python check_once.py
      - name: Send daily health heartbeat
        if: ${{ always() && (github.event.schedule == '9 1 16-30 9 *' || github.event.schedule == '9 1 1-6 10 *') }}
        env:
          CHECK_OUTCOME: ${{ steps.availability_check.outcome }}
        run: |
          python - <<'PY'
          import os
          from monitor import send_bark
          outcome = os.getenv("CHECK_OUTCOME", "unknown")
          ok = outcome == "success"
          send_bark(
              "最后的晚餐监控正常" if ok else "最后的晚餐监控异常",
              (
                  "每日状态：云端监控本次检查成功。目前会继续监控 2026-10-06；发现余票会另发紧急通知。"
                  if ok
                  else "每日状态：云端任务已运行，但本次票务检查失败。每日状态通知仍正常，请查看 GitHub Actions。"
              ),
              urgent=False,
          )
          PY
