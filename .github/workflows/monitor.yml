name: Last Supper ticket monitor

on:
  push:
    branches: [main]
  schedule:
    # GitHub's minimum interval is 5 minutes. Offset from the top of the hour.
    - cron: "2/5 * 15-30 9 *"
    - cron: "2/5 * 1-6 10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: last-supper-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BARK_URL: ${{ secrets.BARK_URL }}
      BARK_LEVEL: timeSensitive
      BARK_SOUND: alarm
      BROWSER_CHANNEL: chrome
      HEADLESS: "true"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send one-time setup test push
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from monitor import send_bark
          send_bark(
              "最后的晚餐余票监控",
              "云端监控已经启动。之后发现 2026-10-06 余票时会立即通知你。",
              urgent=True,
          )
          PY
      - name: Check 2026-10-06 availability
        run: python check_once.py
